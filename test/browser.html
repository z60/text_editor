<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>selftest</title>
<link rel="stylesheet" href="../node_modules/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="../node_modules/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="../css/app.css">
<style>#result { position: fixed; left: -9999px; top: 0; }</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="docbar"><div id="tabbar"></div></div>
  <div id="workarea">
    <div id="editor"></div>
    <div id="merge" class="hidden">
      <div id="merge-toolbar"></div>
      <div id="merge-head">
        <div class="merge-title left"><span class="merge-badge">左</span><span id="merge-title-left">—</span></div>
        <div class="merge-title right"><span class="merge-badge">右</span><span id="merge-title-right">—</span></div>
      </div>
      <div id="merge-body">
        <div class="merge-pane left" id="merge-left"></div>
        <div class="merge-pane right" id="merge-right"></div>
      </div>
    </div>
  </div>
  <div id="statusbar">
    <span class="st-item" id="st-file">—</span>
    <span class="st-item" id="st-stat">—</span>
    <span class="st-item" id="st-pos">1 行, 1 列</span>
    <span class="st-item" id="st-sel"></span>
    <span class="st-spacer"></span>
    <span class="st-item st-click" id="st-enc">UTF-8</span>
    <span class="st-item st-click" id="st-nl">CRLF</span>
    <span class="st-item st-click" id="st-mode">纯文本</span>
    <span class="st-item" id="st-msg"></span>
  </div>
</div>
<div id="modal-root"></div>
<div id="drop-hint">drop</div>

<script src="../node_modules/codemirror/lib/codemirror.js"></script>
<script src="../node_modules/codemirror/addon/mode/loadmode.js"></script>
<script src="../node_modules/codemirror/addon/edit/matchbrackets.js"></script>
<script src="../node_modules/codemirror/addon/edit/closebrackets.js"></script>
<script src="../node_modules/codemirror/addon/selection/active-line.js"></script>
<script src="../node_modules/codemirror/addon/comment/comment.js"></script>
<script src="../node_modules/codemirror/addon/hint/show-hint.js"></script>
<script src="../node_modules/codemirror/addon/hint/anyword-hint.js"></script>
<script src="../node_modules/encoding-japanese/encoding.js"></script>

<script src="../js/core.js"></script>
<script src="../js/lang.js"></script>
<script src="../js/diff.js"></script>
<script src="../js/format.js"></script>
<script src="../js/app.js"></script>

<pre id="result"></pre>
<script>
(function () {
  var log = [], pass = 0, fail = 0;
  function ok(name, cond, extra) {
    if (cond) { pass++; log.push('PASS | ' + name); }
    else { fail++; log.push('FAIL | ' + name + (extra ? ' | ' + extra : '')); }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function flush() { document.getElementById('result').textContent = log.join('\n') + '\n### SELFTEST DONE ### pass=' + pass + ' fail=' + fail; }

  window.onerror = function (msg, src, line) { log.push('FAIL | 脚本异常 | ' + msg + ' @' + line); fail++; flush(); };

  async function run() {
    var ed = SAK.App.editor;
    var wrapper = ed.getWrapperElement();
    ok('编辑器已创建', !!ed && !!ed.getWrapperElement());
    ok('工具栏已生成', document.querySelectorAll('#toolbar .tbtn').length >= 8, 'buttons=' + document.querySelectorAll('#toolbar .tbtn').length);

    /* ---- 排序 ---- */
    ed.setValue('banana\napple\ncherry\n');
    SAK.App.sortLines('asc');
    ok('Ctrl+Alt+A 升序', ed.getValue() === 'apple\nbanana\ncherry\n', JSON.stringify(ed.getValue()));

    ed.setValue('a\nc\nb\n');
    SAK.App.sortLines('desc');
    ok('Ctrl+Alt+D 降序', ed.getValue() === 'c\nb\na\n', JSON.stringify(ed.getValue()));

    ed.setValue('头\n3\n1\n2\n尾\n');
    ed.setSelection({ line: 1, ch: 0 }, { line: 3, ch: 1 });
    SAK.App.sortLines('asc');
    ok('仅排序选区', ed.getValue() === '头\n1\n2\n3\n尾\n', JSON.stringify(ed.getValue()));

    /* ---- 按键绑定是否真的挂上 ---- */
    function press(key, mods) {
      var e = new KeyboardEvent('keydown', Object.assign({ key: key, code: key, bubbles: true, cancelable: true }, mods || {}));
      ed.getInputField().dispatchEvent(e);
    }
    ed.setValue('b\na\n');
    ed.focus();
    press('A', { ctrlKey: true, altKey: true, keyCode: 65 });
    await sleep(60);
    ok('Ctrl+Alt+A 快捷键生效', ed.getValue() === 'a\nb\n', JSON.stringify(ed.getValue()));

    ed.setValue('1\n2\n1\n');
    press('m', { altKey: true, keyCode: 77 });
    await sleep(60);
    ok('Alt+M 快捷键去重', ed.getValue() === '1\n2\n', JSON.stringify(ed.getValue()));

    /* ---- 去重 ---- */
    ed.setValue('a\nb\na\nc\nb\n');
    SAK.App.dedupeLines();
    ok('去重（全文）', ed.getValue() === 'a\nb\nc\n', JSON.stringify(ed.getValue()));

    ed.setValue('k\na\na\nb\nz\n');
    ed.setSelection({ line: 1, ch: 0 }, { line: 3, ch: 1 });
    SAK.App.dedupeLines();
    ok('去重（选区）', ed.getValue() === 'k\na\nb\nz\n', JSON.stringify(ed.getValue()));

    /* ---- 粘贴多个文件 → 可点击路径 ---- */
    ed.setValue('');
    var dt = new DataTransfer();
    dt.items.add(new File(['内容一号'], 'note1.txt', { type: 'text/plain' }));
    dt.items.add(new File(['内容二号'], 'note2.txt', { type: 'text/plain' }));
    wrapper.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
    await sleep(150);
    ed.refresh();
    await sleep(60);
    ok('粘贴 2 个文件变成 2 行路径', ed.getValue() === 'note1.txt\nnote2.txt', JSON.stringify(ed.getValue()));
    var marks = wrapper.querySelectorAll('.cm-file-path');
    ok('路径渲染为可点击元素', marks.length === 2, 'marks=' + marks.length);

    if (marks.length) {
      var before = SAK.App.docs.length;
      marks[0].dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      await sleep(400);
      ok('点击路径打开新标签', SAK.App.docs.length === before + 1, 'docs=' + SAK.App.docs.length);
      var opened = SAK.App.docs[SAK.App.docs.length - 1];
      ok('打开的文件内容正确', opened.cmDoc.getValue() === '内容一号', JSON.stringify(opened.cmDoc.getValue()));
    }

    /* ---- 剪贴板同时带真实路径文本时优先显示路径 ---- */
    SAK.App.newDoc();
    await sleep(60);
    ed.setValue('');
    var dt3 = new DataTransfer();
    dt3.setData('text/plain', 'C:\\temp\\p.txt');
    dt3.items.add(new File(['x'], 'p.txt', { type: 'text/plain' }));
    wrapper.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt3, bubbles: true, cancelable: true }));
    await sleep(150);
    ok('优先使用剪贴板里的真实路径', ed.getValue() === 'C:\\temp\\p.txt', JSON.stringify(ed.getValue()));

    /* ---- 拖入「单个」文件 → 直接打开成新标签页 ---- */
    var hostDoc = SAK.App.newDoc();
    await sleep(60);
    var beforeSingle = SAK.App.docs.length;
    var dropOne = dropWith([{ name: 'dropped.txt', content: '拖进来的内容\n' }]);
    Object.defineProperty(dropOne, 'pageX', { value: 12 });
    Object.defineProperty(dropOne, 'pageY', { value: 12 });
    wrapper.dispatchEvent(dropOne);
    await waitFor(function () { return SAK.App.docs.length === beforeSingle + 1; });
    await sleep(150);
    var openedByDrop = SAK.App.docs[SAK.App.docs.length - 1];
    ok('拖入单个文件直接打开成新标签页', SAK.App.docs.length === beforeSingle + 1, 'docs=' + SAK.App.docs.length);
    ok('拖入单个文件：标签名与内容正确',
      openedByDrop.name === 'dropped.txt' && openedByDrop.cmDoc.getValue() === '拖进来的内容\n',
      openedByDrop.name + ' | ' + JSON.stringify(openedByDrop.cmDoc.getValue()));
    ok('拖入单个文件不会改动原文档', hostDoc.cmDoc.getValue() === '', JSON.stringify(hostDoc.cmDoc.getValue()));
    ok('拖入单个文件会切到这个文档', SAK.App.active === openedByDrop, SAK.App.active && SAK.App.active.name);

    /* ---- 拖入「多个」文件 → 维持原样：插入可点击路径 ---- */
    var hostDoc2 = SAK.App.newDoc();
    await sleep(60);
    var beforeMulti = SAK.App.docs.length;
    var dropTwo = dropWith([
      { name: 'drag1.txt', content: '一是' },
      { name: 'drag2.txt', content: '二是' }
    ]);
    Object.defineProperty(dropTwo, 'pageX', { value: 12 });
    Object.defineProperty(dropTwo, 'pageY', { value: 12 });
    wrapper.dispatchEvent(dropTwo);
    await sleep(300);
    ed.refresh();
    await sleep(80);
    ok('拖入多个文件仍插入可点击路径', hostDoc2.cmDoc.getValue() === 'drag1.txt\ndrag2.txt',
      JSON.stringify(hostDoc2.cmDoc.getValue()));
    ok('拖入多个文件不新开标签页', SAK.App.docs.length === beforeMulti,
      'docs=' + SAK.App.docs.length + ' before=' + beforeMulti);

    /* ---- 语法高亮 ---- */
    ed.setValue('public class A {\n    public static void main(String[] args) {\n        System.out.println("hi");\n    }\n}\n');
    var langSel = document.getElementById('lang-select');
    langSel.value = 'java';
    langSel.dispatchEvent(new Event('change'));
    await sleep(500);
    ed.refresh();
    await sleep(80);
    ok('Java 模式文件已加载', typeof CodeMirror.modes.clike !== 'undefined');
    var kws = wrapper.querySelectorAll('.cm-keyword');
    ok('代码关键字已变色（cm-keyword）', kws.length > 0, 'kw=' + kws.length);

    /* ---- 粘贴后自动识别语言（change origin = +paste） ---- */
    var d = SAK.App.newDoc();
    await sleep(50);
    ed.replaceSelection('import os\n\n\ndef run():\n    print("hi")\n', 'end', '+paste');
    await sleep(400);
    ok('粘贴后自动识别为 Python', d.langId === 'python', 'langId=' + d.langId);
    var plan = SAK.langById(d.langId).label;
    ok('状态栏语法显示', document.getElementById('st-mode').textContent.indexOf(plan) >= 0,
      'status=' + document.getElementById('st-mode').textContent);

    /* ---- 格式化 ---- */
    var javaMessy = 'public class A{\npublic void f(){\nint x=1;\n}\n}\n';
    var javaOut = await SAK.formatText(javaMessy, 'java', { tabSize: 4 });
    ok('内置 Java 结构重排', javaOut === 'public class A {\n    public void f() {\n        int x = 1;\n    }\n}\n', JSON.stringify(javaOut));

    var pyOut = await SAK.formatText('def f():\n  x=1\n  return x\n', 'python', { tabSize: 4 });
    ok('内置 Python 格式化（缩进 + 行内空格）', pyOut === 'def f():\n    x = 1\n    return x\n', JSON.stringify(pyOut));

    var sqlOut = await SAK.formatText('select a,b from t where x=1 and y=2', 'sql', { tabSize: 2 });
    ok('sql-formatter 已加载并可用', /SELECT/i.test(sqlOut) && /\n/.test(sqlOut), JSON.stringify(sqlOut).slice(0, 120));

    var jsOut = await SAK.formatText('const a=1;function f(x){return x+1;}', 'javascript', { tabSize: 2 });
    ok('Prettier 格式化 JavaScript', jsOut.indexOf('const a = 1;') >= 0 && jsOut.indexOf('\n') > 0, JSON.stringify(jsOut).slice(0, 160));

    var jsonOut = await SAK.formatText('{"a":1,"b":[1,2]}', 'json', { tabSize: 2 });
    ok('Prettier 格式化 JSON', jsonOut.indexOf('"a": 1') >= 0, JSON.stringify(jsonOut).slice(0, 120));
    ok('压缩 JSON 展开为多行缩进', jsonOut === '{\n  "a": 1,\n  "b": [1, 2]\n}\n', JSON.stringify(jsonOut));
    var jsonLit = await SAK.formatText('{"n":1.0,"big":12345678901234567890,"s":"a\\u00e9b"}', 'json', { tabSize: 2 });
    ok('JSON 数字/转义字面量原样保留',
      jsonLit.indexOf('1.0') >= 0 && jsonLit.indexOf('12345678901234567890') >= 0 && jsonLit.indexOf('\\u00e9') >= 0,
      JSON.stringify(jsonLit));

    var htmlOut = await SAK.formatText('<div><p>a</p><span>b</span></div>', 'html', { tabSize: 2 });
    ok('Prettier 格式化 HTML', htmlOut.indexOf('<div>') >= 0 && htmlOut.indexOf('\n') > 0, JSON.stringify(htmlOut).slice(0, 160));

    /* ---- 应用到编辑器（走对话框那条路径） ---- */
    SAK.App.newDoc();
    ed.setValue('public class B{\nvoid g(){\nint y=2;\n}\n}\n');
    document.getElementById('lang-select').value = 'java';
    document.getElementById('lang-select').dispatchEvent(new Event('change'));
    await sleep(200);
    SAK.App.openFormatDialog();
    await sleep(80);
    var modal = document.querySelector('.overlay .modal');
    ok('Ctrl+Alt+F 对话框已打开', !!modal);
    var fmtBtn = null;
    Array.prototype.forEach.call(document.querySelectorAll('.overlay .modal-foot .btn'), function (b) {
      if (b.textContent === '格式化') fmtBtn = b;
    });
    ok('对话框有格式化按钮', !!fmtBtn);
    if (fmtBtn) {
      fmtBtn.click();
      await sleep(500);
      ok('对话框格式化已写回编辑器', ed.getValue().indexOf('    void g() {') >= 0, JSON.stringify(ed.getValue()));
    }

    /* ---- 撤销：格式化可 Ctrl+Z 回退 ---- */
    ed.undo();
    await sleep(60);
    ok('Ctrl+Z 可撤销格式化', ed.getValue().indexOf('void g(){') >= 0, JSON.stringify(ed.getValue()));

    /* ---- 对话框里的 Java / Python 要真的格式化到位 ---- */
    async function formatViaDialog(text) {
      var d = SAK.App.newDoc();
      await sleep(60);
      ed.setValue('');
      ed.replaceSelection(text, 'end', '+paste');   // 和真实粘贴同一条路径
      await sleep(400);
      SAK.App.openFormatDialog();
      await sleep(100);
      var sel = document.querySelector('.overlay .modal select');
      var picked = sel ? sel.value : '';
      var btn = null;
      Array.prototype.forEach.call(document.querySelectorAll('.overlay .modal-foot .btn'), function (b) {
        if (b.textContent === '格式化') btn = b;
      });
      if (btn) btn.click();
      await sleep(600);
      return { doc: d, out: d.cmDoc.getValue(), picked: picked };
    }

    var rj = await formatViaDialog('public class M{\npublic static void main(String[] a){\nint x=1;\nif(x>0){\nSystem.out.println("hi"+x);\n}\n}\n}\n');
    ok('对话框格式化 Java：语言预选 java', rj.picked === 'java', 'picked=' + rj.picked);
    ok('对话框格式化 Java：关键字后括号补空格', rj.out.indexOf('if (x > 0) {') >= 0, JSON.stringify(rj.out));
    ok('对话框格式化 Java：字符串拼接补空格', rj.out.indexOf('"hi" + x') >= 0, JSON.stringify(rj.out));
    ok('对话框格式化 Java：缩进重排', rj.out.indexOf('\n        int x = 1;') >= 0, JSON.stringify(rj.out));

    var rp = await formatViaDialog('import os\ndef main():\n  x=1\n  if os.path.exists("a"):\n    print(x)\n  return x\n');
    ok('对话框格式化 Python：语言预选 python', rp.picked === 'python', 'picked=' + rp.picked);
    ok('对话框格式化 Python：赋值号两侧补空格', rp.out.indexOf('x = 1') >= 0, JSON.stringify(rp.out));
    ok('对话框格式化 Python：缩进规范为 4 空格', rp.out.indexOf('\n    if os.path.exists') >= 0, JSON.stringify(rp.out));

    /* ---- 挤成一行的 Python 嵌套字典要摊成一项一行 ---- */
    var pyOneLine = 'data={"name":"张三","age":28,"city":"北京","hobbies":["阅读","跑步","编程"],"isStudent":False,"address":{"street":"中关村大街1号","zip":"100000"}}';
    var rp1 = await formatViaDialog(pyOneLine);
    ok('一行 Python 字典：自动识别为 python', rp1.picked === 'python', 'picked=' + rp1.picked);
    ok('一行 Python 字典：摊成一项一行并缩进',
      rp1.out.indexOf('data = {\n    "name": "张三",\n    "age": 28,\n    "city": "北京",') >= 0 &&
      rp1.out.indexOf('\n    "isStudent": False,') >= 0 && rp1.out.indexOf('\n}') >= 0,
      JSON.stringify(rp1.out));
    ok('一行 Python 字典：中文与嵌套内容完好',
      rp1.out.indexOf('"中关村大街1号"') >= 0 && rp1.out.indexOf('["阅读", "跑步", "编程"]') >= 0,
      JSON.stringify(rp1.out));
    var rp1b = await SAK.formatText(rp1.out, 'python', { tabSize: 4, printWidth: 100 });
    ok('一行 Python 字典：格式化结果幂等', rp1b === rp1.out);

    /* ---- 挤成一行的 Java（粘贴过来的常见形态）要能摊成一句一行 ---- */
    var oneLineJava = 'Map<String, Object> data = new HashMap<>(); data.put("name", "张三"); data.put("age", 28); data.put("city", "北京"); data.put("hobbies", Arrays.asList("阅读", "跑步", "编程")); data.put("isStudent", false); Map<String, Object> address = new HashMap<>(); address.put("street", "中关村大街1号"); address.put("zip", "100000"); data.put("address", address);';
    var r1 = await formatViaDialog(oneLineJava);
    ok('一行 Java：自动识别为 java', r1.picked === 'java', 'picked=' + r1.picked);
    ok('一行 Java：按分号摊成一句一行', r1.out.split('\n').length === 10 &&
      r1.out.indexOf('\ndata.put("name", "张三");') >= 0, JSON.stringify(r1.out));
    ok('一行 Java：中文与括号内容完好',
      r1.out.indexOf('Arrays.asList("阅读", "跑步", "编程")') >= 0 &&
      r1.out.indexOf('"中关村大街1号"') >= 0, JSON.stringify(r1.out));
    var r1b = await SAK.formatText(r1.out, 'java', { tabSize: 4 });
    ok('一行 Java：格式化结果幂等', r1b === r1.out);

    /* ---- 一行写完的类也要摊开 ---- */
    var r2 = await formatViaDialog('public class A{public static void main(String[] a){int x=1;if(x>0){System.out.println("hi"+x);}}}');
    ok('一行写完的类被摊开并缩进',
      r2.out.indexOf('public class A {\n    public static void main(String[] a) {\n        int x = 1;') >= 0 &&
      r2.out.indexOf('        if (x > 0) {\n            System.out.println("hi" + x);') >= 0,
      JSON.stringify(r2.out));

    /* ---- 语言还停在纯文本时，打开对话框要自己认出语言（JSON 之外的兜底） ---- */
    var docPlain = SAK.App.newDoc();
    await sleep(60);
    ed.setValue('public class Z{\nvoid f(){\nint x=1;\n}\n}\n');
    await sleep(150);
    SAK.App.openFormatDialog();
    await sleep(120);
    var selPlain = document.querySelector('.overlay .modal select');
    ok('纯文本文档打开对话框会自动识别语言', !!selPlain && selPlain.value === 'java',
      'doc.langId=' + docPlain.langId + ' picked=' + (selPlain && selPlain.value));
    var cancelBtn = null;
    Array.prototype.forEach.call(document.querySelectorAll('.overlay .modal-foot .btn'), function (b) {
      if (b.textContent === '取消') cancelBtn = b;
    });
    if (cancelBtn) cancelBtn.click();
    await sleep(150);
    ok('取消后对话框已关闭', !document.querySelector('.overlay .modal'));

    /* ---- 编码 / 换行 / 打开保存相关 ---- */
    ok('编码表可用', SAK.encodingLabel('SJIS') === 'Shift_JIS');
    var doc = SAK.App.active;
    var select = document.getElementById('nl-select');
    select.value = 'LF';
    select.dispatchEvent(new Event('change'));
    await sleep(50);
    ok('切换换行符', doc.newline === 'LF' && doc.isDirty() === true);

    var bytes = SAK.encoding.encode('日本語テスト', 'SJIS');
    var decoded = SAK.encoding.decode(bytes, 'SJIS');
    ok('Shift_JIS 编解码', decoded === '日本語テスト');

    /* ---- 状态栏 ---- */
    ok('状态栏行数统计', /\d+ 行 \/ \d+ 字符/.test(document.getElementById('st-stat').textContent),
      document.getElementById('st-stat').textContent);
    ok('没有脚本错误', document.getElementById('st-msg').textContent.indexOf('脚本错误') < 0,
      document.getElementById('st-msg').textContent);

    /* ---- 快捷键自定义 ---- */
    var settingsBackup = localStorage.getItem('sakura.settings.v2');

    function rowFor(label) {
      var rows = document.querySelectorAll('.keymap-table tr');
      for (var i = 0; i < rows.length; i++) {
        var tds = rows[i].querySelectorAll('td');
        if (tds.length >= 3 && tds[0].textContent.indexOf(label) >= 0) {
          return { cap: tds[1].querySelector('.keycap'), hint: tds[1].querySelector('.km-hint'), reset: tds[2].querySelector('.linkbtn') };
        }
      }
      return null;
    }
    function keyEvent(key, code, keyCode, mods) {
      return new KeyboardEvent('keydown', Object.assign({
        key: key, code: code, keyCode: keyCode, bubbles: true, cancelable: true
      }, mods || {}));
    }

    SAK.App.openKeymapDialog();
    await sleep(100);
    var dupRow = rowFor('删除重复行');
    ok('快捷键设置窗口已打开', !!dupRow && !!document.querySelector('.overlay .modal'));

    dupRow.cap.click();
    await sleep(40);
    ok('点击后进入等待按键状态', dupRow.cap.classList.contains('capturing'));
    window.dispatchEvent(keyEvent('j', 'KeyJ', 74, { ctrlKey: true, altKey: true }));
    await sleep(80);
    ok('捕获并保存新快捷键', SAK.settings.keymap['text.dedupe'] === 'Ctrl-Alt-J',
      JSON.stringify(SAK.settings.keymap));
    ok('按钮显示新键位', rowFor('删除重复行').cap.textContent === 'Ctrl+Alt+J',
      rowFor('删除重复行').cap.textContent);
    ok('已写入 localStorage',
      JSON.parse(localStorage.getItem('sakura.settings.v2')).keymap['text.dedupe'] === 'Ctrl-Alt-J');

    /* 冲突检测 + Esc 只取消捕获不关窗口 */
    var ascRow = rowFor('按行升序排序');
    ascRow.cap.click();
    await sleep(40);

    async function waitFor(fn, ms) {

        await sleep(50);

      // 真实浏览器一定会给 drop 事件挂上 dataTransfer；
      // 合成事件时若构造器不支持，就手动挂一个行为一致的替身
      ev.dataTransfer = dt.dataTransfer || dt;
      if (!ev.dataTransfer || !ev.dataTransfer.files) {
        ev.dataTransfer = {
          files: dt.files,
          types: ['Files'],
          getData: function () { return ''; }
        };
      }
      return ev;

    function anchorViewportDiff(cm1, l1, cm2, l2) {

      var y2 = cm2.charCoords({ line: l2, ch: 0 }, 'page').top - r2.top;

      mRight.getScrollInfo().top + ' vs 2400');
    mRight.scrollTo(0, 3000);
    mRight.getScrollerElement().dispatchEvent(new Event('scroll'));
    await sleep(150);
    ok('反向滚动同样 1:1', Math.abs(mLeft.getScrollInfo().top - 3000) < 3,
      mLeft.getScrollInfo().top + ' vs 3000');
    ok('对齐后跳差异仍保持对齐', (function () {
      SAK.App.gotoHunk(0);
      return Math.abs(M.mLeft.getScrollInfo().top - M.mRight.getScrollInfo().top) < 3;
    })(), mLeft.getScrollInfo().top + ' vs ' + mRight.getScrollInfo().top);

    var clearBtn = null;
    Array.prototype.forEach.call(document.querySelectorAll('#merge-toolbar .tbtn'), function (b) {
      if (b.textContent === '清除对齐') clearBtn = b;
    });
    ok('工具栏有「清除对齐」按钮', !!clearBtn);
    if (clearBtn) clearBtn.click();
    await sleep(300);
    ok('清除后锚点标记消失、占位块回到按差异自动算',
      !M.anchors.length && !M.pending &&
      String(mLeft.getLineHandle(120).bgClass || '').indexOf('cm-merge-anchor') < 0 &&
      document.querySelectorAll('#merge-left .cm-phantom-stack').length +
      document.querySelectorAll('#merge-right .cm-phantom-stack').length === phantomsBefore,
      JSON.stringify(M.anchors) + ' phantoms=' + document.querySelectorAll('#merge-left .cm-phantom-stack').length);

    /* --- 用户给的例子：左 111/222/start ↔ 右 3333/111/111/start --- */
    SAK.App.exitMerge(true);
    await sleep(150);
    var dP = mkDoc('p.txt', ['111', '222', 'start']);
    var dQ = mkDoc('q.txt', ['3333', '111', '111', 'start']);
    SAK.App.startMerge(dP, dQ);
    await sleep(300);
    var hunksP = M.hunks.length;

    mRight.setCursor({ line: 1, ch: 0 });          // 右边第 2 行
    M.focus = mRight;
    pressOn(mRight, 'F2', 113);
    await sleep(150);
    ok('右侧按 F2 标记了第 2 行', !!M.pending && M.pending.side === 'right' && M.pending.line === 1,
      JSON.stringify(M.pending));
    clickLine(mLeft, 0);                            // 点左边第 1 行
    await sleep(300);
    ok('左 111 与右边第 2 行排在同一行',
      anchorViewportDiff(M.mLeft, 0, M.mRight, 1) <= 3,
      'diff=' + anchorViewportDiff(M.mLeft, 0, M.mRight, 1));
    ok('例子里两边内容都对得上',
      M.mLeft.getLine(0) === '111' && M.mRight.getLine(1) === '111' &&
      anchorViewportDiff(M.mLeft, 2, M.mRight, 3) <= 3,
      'start 行 diff=' + anchorViewportDiff(M.mLeft, 2, M.mRight, 3));

    mRight.setCursor({ line: 2, ch: 0 });          // 右边第 3 行
    M.focus = mRight;
    pressOn(mRight, 'F2', 113);
    await sleep(150);
    clickLine(M.mLeft, 0);                          // 还是点左边第 1 行
    await sleep(300);
    ok('改标记后：左 111 与右边第 3 行排在同一行',
      M.anchors.length === 1 && M.anchors[0].left === 0 && M.anchors[0].right === 2 &&
      anchorViewportDiff(M.mLeft, 0, M.mRight, 2) <= 3,
      JSON.stringify(M.anchors) + ' diff=' + anchorViewportDiff(M.mLeft, 0, M.mRight, 2));
    ok('重排后 start 那两行仍然对齐',
      anchorViewportDiff(M.mLeft, 2, M.mRight, 3) <= 3,
      'diff=' + anchorViewportDiff(M.mLeft, 2, M.mRight, 3));
    ok('例子里差异结果始终没变', M.hunks.length === hunksP, M.hunks.length + '/' + hunksP);
    SAK.App.exitMerge(true);
    await sleep(150);

    /* --- 多对累积：右2↔左1 之后再配 右3↔左2，第一对不能被顶掉 --- */
    var dM1 = mkDoc('m1.txt', ['aaa', 'bbb', 'ccc']);
    var dM2 = mkDoc('m2.txt', ['111', 'aaa', 'aaa', 'ccc', 'bbb']);
    SAK.App.startMerge(dM1, dM2);
    await sleep(300);
    var hunksM = M.hunks.length;

    M.mRight.setCursor({ line: 1, ch: 0 });        // 右边第 2 行
    M.focus = M.mRight;
    pressOn(M.mRight, 'F2', 113);
    await sleep(150);
    clickLine(M.mLeft, 0);                          // 左边第 1 行
    await sleep(300);
    ok('第 1 对生效：左1 ↔ 右2',
      M.anchors.length === 1 && anchorViewportDiff(M.mLeft, 0, M.mRight, 1) <= 3,
      JSON.stringify(M.anchors) + ' diff=' + anchorViewportDiff(M.mLeft, 0, M.mRight, 1));

    M.mRight.setCursor({ line: 2, ch: 0 });        // 右边第 3 行
    M.focus = M.mRight;
    pressOn(M.mRight, 'F2', 113);
    await sleep(150);
    clickLine(M.mLeft, 1);                          // 左边第 2 行
    await sleep(300);
    ok('第 2 对生效：左2 ↔ 右3，两对都在',
      M.anchors.length === 2 && anchorViewportDiff(M.mLeft, 1, M.mRight, 2) <= 3,
      JSON.stringify(M.anchors) + ' diff=' + anchorViewportDiff(M.mLeft, 1, M.mRight, 2));
    ok('配第二对时第一对没有被取消（左1 仍对齐右2）',
      anchorViewportDiff(M.mLeft, 0, M.mRight, 1) <= 3,
      'diff=' + anchorViewportDiff(M.mLeft, 0, M.mRight, 1));
    ok('下面的相同行（ccc）也跟着对齐',
      anchorViewportDiff(M.mLeft, 2, M.mRight, 3) <= 3,
      'diff=' + anchorViewportDiff(M.mLeft, 2, M.mRight, 3));
    ok('多对累积时差异结果仍然不变', M.hunks.length === hunksM, M.hunks.length + '/' + hunksM);
    ok('四行都标上了对齐高亮',
      String(M.mLeft.getLineHandle(0).bgClass || '').indexOf('cm-merge-anchor') >= 0 &&
      String(M.mLeft.getLineHandle(1).bgClass || '').indexOf('cm-merge-anchor') >= 0 &&
      String(M.mRight.getLineHandle(1).bgClass || '').indexOf('cm-merge-anchor') >= 0 &&
      String(M.mRight.getLineHandle(2).bgClass || '').indexOf('cm-merge-anchor') >= 0,
      [M.mLeft.getLineHandle(0).bgClass, M.mLeft.getLineHandle(1).bgClass,
        M.mRight.getLineHandle(1).bgClass, M.mRight.getLineHandle(2).bgClass].join(' | '));
    ok('状态栏显示 2 对对齐', document.getElementById('st-pos').textContent.indexOf('行对齐 2 对') >= 0,
      document.getElementById('st-pos').textContent);
    SAK.App.exitMerge(true);
    await sleep(150);

    ok('F2 已注册成可自定义快捷键', SAK.App.currentKeyOf('merge.anchor') === 'F2',
      'key=' + SAK.App.currentKeyOf('merge.anchor'));
    ok('F12 作为别名键也能触发', (function () {
      var extra = ed.getOption('extraKeys') || {};
      return !!extra['F2'] && !!extra['F12'];
    })(), Object.keys(ed.getOption('extraKeys') || {}).filter(function (k) { return /^F1?2?$/.test(k); }).join(','));
    ok('「比较合并」分组里能查到这两个新命令', (function () {
      var ids = (SAK.App.commands || []).filter(function (c) { return c.group === '比较合并'; })
        .map(function (c) { return c.id; });
      return ids.indexOf('merge.anchor') >= 0 && ids.indexOf('merge.anchorClear') >= 0;
    })(), (SAK.App.commands || []).filter(function (c) { return c.group === '比较合并'; })
      .map(function (c) { return c.id; }).join(','));
    SAK.App.startMerge(dP, dQ);
    await sleep(250);

    /* --- 选项 --- */
    SAK.App.exitMerge(true);
    await sleep(150);
    var dG = mkDoc('G.txt', ['x  ', 'y']);
    var dH = mkDoc('H.txt', ['x', 'y']);
    SAK.App.startMerge(dG, dH);
    await sleep(250);
    ok('默认不忽略行尾空白 → 有差异', M.hunks.length === 1, 'hunks=' + M.hunks.length);
    var ignCb = document.querySelectorAll('#merge-toolbar input[type="checkbox"]')[0];
    ignCb.checked = true;
    ignCb.dispatchEvent(new Event('change'));
    await sleep(250);
    ok('勾选忽略行尾空白后无差异', M.hunks.length === 0, 'hunks=' + M.hunks.length);

    /* --- 比较时也能用排序 / 去重 / 格式化 --- */
    M.mRight.setValue('b\na\nb\n');
    await sleep(500);
    M.focus = M.mRight;
    SAK.App.dedupeLines(M.mRight);
    await sleep(500);
    ok('比较视图里 Alt+M 去重可用', M.mRight.getValue() === 'b\na\n', JSON.stringify(M.mRight.getValue()));
    SAK.App.sortLines('asc', M.mRight);
    await sleep(500);
    ok('比较视图里排序可用', M.mRight.getValue() === 'a\nb\n', JSON.stringify(M.mRight.getValue()));

    /* --- 保存左右侧会写回对应文档 --- */
    var beforeSave = dG.cmDoc.getValue();
    M.focus = M.mRight;
    dH.handle = null;
    SAK.App.saveDoc = SAK.App.saveDoc;   // 保留引用（真实保存会走下载，这里只验证写回）
    M.mRight.setValue('merged by test\n');
    await sleep(100);
    var realSave = SAK.App.saveDoc;
    ok('保存前右侧文档内容未变', dH.cmDoc.getValue() === 'x\ny', JSON.stringify(dH.cmDoc.getValue()));

    /* --- 退出 --- */
    SAK.App.exitMerge(true);
    await sleep(200);
    ok('再次退出比较正常', M.on === false);
    ok('退出比较后行对齐已被清掉', !M.anchors.length && !M.pending,
      JSON.stringify(M.anchors) + ' pending=' + JSON.stringify(M.pending));
    ok('主编辑器恢复显示', !document.getElementById('editor').classList.contains('hidden'));
    ok('右边文档内容仍为合并前的值（未点保存不写回）', dH.cmDoc.getValue() === 'x\ny',
      JSON.stringify(dH.cmDoc.getValue()));
    ok('左侧文档未被动过', dG.cmDoc.getValue() === beforeSave);

    /* --- 快捷键已在注册表中 --- */
    ok('比较命令可自定义快捷键',
      SAK.App.currentKeyOf('merge.open') === 'Ctrl-Alt-M' &&
      SAK.App.currentKeyOf('merge.next') === 'F7' &&
      SAK.App.currentKeyOf('merge.toRight') === 'Ctrl-Alt-Right',
      [SAK.App.currentKeyOf('merge.open'), SAK.App.currentKeyOf('merge.next')].join('/'));

    /* --- 非比较视图下按 F2：只提示，不报错、不留状态 --- */
    document.dispatchEvent(new KeyboardEvent('keydown', {
      key: 'F2', code: 'F2', keyCode: 113, bubbles: true, cancelable: true
    }));
    await sleep(150);
    ok('非比较视图按 F2 只给提示', !M.pending && !M.anchors.length &&
      document.getElementById('st-msg').textContent.indexOf('比较视图') >= 0,
      'msg=' + document.getElementById('st-msg').textContent);

    /* --- 键名顺序必须与 CodeMirror 的查表键名一致，否则 extraKeys 里查不到 --- */
    (function () {
      var probes = [
        ['file.saveAs', 83, { ctrlKey: true, shiftKey: true }],
        ['format.open', 70, { ctrlKey: true, altKey: true }],
        ['file.save', 83, { ctrlKey: true }],
        ['text.dedupe', 77, { altKey: true }],
        ['edit.comment', 191, { ctrlKey: true }]
      ];
      var extra = ed.getOption('extraKeys') || {};
      var bad = probes.filter(function (p) {
        var name = SAK.App.currentKeyOf(p[0]);
        var cmName = CodeMirror.keyName(Object.assign({ keyCode: p[1] }, p[2]));
        return name !== cmName || !(cmName in extra);
      });
      ok('编辑器快捷键键名与 CodeMirror 一致（含 Shift+Ctrl 组合）', bad.length === 0,
        bad.map(function (p) {
          return p[0] + ': ' + SAK.App.currentKeyOf(p[0]) + ' vs ' +
            CodeMirror.keyName(Object.assign({ keyCode: p[1] }, p[2]));
        }).join(' | '));
    })();

    flush();
  }

  window.addEventListener('load', function () {
    setTimeout(function () {
      run().catch(function (e) {
        fail++;
        log.push('FAIL | 测试过程抛出异常 | ' + (e && e.stack ? e.stack.split('\n')[0] : e));
        flush();
      });
    }, 120);
  });
})();
</script>
</body>
</html>
